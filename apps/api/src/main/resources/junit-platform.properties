# Parallel execution disabled — enable later once the test suite is stable.
junit.jupiter.execution.parallel.enabled = false

# Automatically convert snake_case method names into a readable display name.
# "should_throw_when_idAbsent" becomes "should throw when id absent" in reports.
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores
