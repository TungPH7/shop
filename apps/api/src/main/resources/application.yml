---
spring:
  application:
    name: "learn-postgresql-api"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}?currentSchema=app&ApplicationName=${spring.application.name}&reWriteBatchedInserts=true&stringtype=unspecified"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      pool-name: "LearnPostgresHikariCP"
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      leak-detection-threshold: 30000
      auto-commit: false
      validation-timeout: 5000
      data-source-properties:
        socketTimeout: 60
        loginTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "validate"
    properties:
      hibernate:
        physical_naming_strategy: "org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy"
        jdbc:
          time_zone: "UTC"
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true
  flyway:
    enabled: true
    locations: "classpath:db/migration"
    schemas: "app"
    default-schema: "app"
    table: "flyway_schema_history"
    baseline-on-migrate: true
    baseline-version: "0"
    baseline-description: "Initial baseline (extensions and app schema from docker\
      \ init script)"
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    encoding: "UTF-8"
    mixed: false
  web:
    resources:
      add-mappings: false
server:
  # PORT, as for every app of the repo: /ao-preview and the deployer choose it; 3001 is where admin and user call api.
  port: "${PORT:3001}"
  servlet:
    context-path: "/"
  forward-headers-strategy: "native"
  error:
    include-stacktrace: "never"
    include-message: "never"
    include-binding-errors: "never"
    include-exception: false
    whitelabel:
      enabled: false
info:
  app:
    name: "${spring.application.name}"
    description: "Learn PostgreSQL with Spring Boot - Enterprise grade API"
    version: "0.0.1-SNAPSHOT"
    encoding: "UTF-8"
    java:
      version: 21
app:
  errors:
    base-url: "${APP_ERRORS_BASE_URL:https://docs.example.com/errors}"
  logging:
    correlation-id-header: "${APP_LOGGING_CORRELATION_ID_HEADER:X-Correlation-Id}"
    correlation-id-mdc-key: "${APP_LOGGING_CORRELATION_ID_MDC_KEY:correlationId}"
    max-correlation-id-length: "${APP_LOGGING_MAX_CORRELATION_ID_LENGTH:128}"
  security:
    cors:
      allowed-origins: "${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}"
      allowed-methods: "${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}"
      allowed-headers: "${APP_SECURITY_CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-Correlation-Id}"
      exposed-headers: "${APP_SECURITY_CORS_EXPOSED_HEADERS:X-Correlation-Id,Location}"
      allow-credentials: "${APP_SECURITY_CORS_ALLOW_CREDENTIALS:false}"
      max-age-seconds: "${APP_SECURITY_CORS_MAX_AGE_SECONDS:3600}"
    headers:
      csp: "${APP_SECURITY_HEADERS_CSP:default-src 'self'; img-src 'self' data:; style-src\
        \ 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'}"
      referrer-policy: "${APP_SECURITY_HEADERS_REFERRER_POLICY:no-referrer}"
      permissions-policy: "${APP_SECURITY_HEADERS_PERMISSIONS_POLICY:geolocation=(),\
        \ camera=(), microphone=()}"
      hsts:
        max-age: "${APP_SECURITY_HEADERS_HSTS_MAX_AGE:31536000}"
        include-subdomains: "${APP_SECURITY_HEADERS_HSTS_INCLUDE_SUBDOMAINS:true}"
        preload: "${APP_SECURITY_HEADERS_HSTS_PRELOAD:false}"
management:
  endpoints:
    web:
      base-path: "/actuator"
      exposure:
        include: "health, info, flyway"
  endpoint:
    health:
      show-details: "when-authorized"
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  level:
    root: "INFO"
    com.tungph7.learnpostgres: "DEBUG"
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    path: "/v3/api-docs"
    enabled: true
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: true
    operations-sorter: "method"
    tags-sorter: "alpha"
    try-it-out-enabled: true
  packages-to-scan: "com.tungph7.learnpostgres.feature"
  paths-to-match: "/api/**, /actuator/health"
