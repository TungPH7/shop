# The agent roles of the contract (agent-roster spec sections 2.1 to 2.3, 2.7 and 6). scripts/render-agents.mjs turns
# each role into .claude/agents/<role>.md, with agents/prompts/<role>.md and the contract. Rules A1 to A5 of
# `npm run validate` check this file. Changing a model, an effort or a skill is your decision (spec section 8).

# Rovo MCP tools behind each Jira permission. executeWrite and executeDestructive run any operation by name, a way
# around the transition hook, so block-atlassian refuses them, but for one operation: link grants executeWrite only for
# createJiraIssueLink, a Blocks link between two items of the project space (the server has no tool of its own for
# it; Pilot 1, T10). No permission grants executeDestructive.
jira_tools:
  read: [getJiraIssue, searchJiraIssuesUsingJql, executeRead]
  create: [createJiraIssue]
  edit: [editJiraIssue]
  comment: [addOrEditJiraIssueComment]
  link: [executeWrite]
  transition: [transitionJiraIssue]

# MCP tools an agent may get, by server and group. Chrome DevTools MCP 1.12.0, from its tool reference (T2). The
# memory, extensions, third-party, WebMCP and PWA groups are left out on purpose; click_at needs --experimentalVision.
mcp_tools:
  chrome-devtools:
    navigation: [close_page, list_pages, navigate_page, new_page, select_page, wait_for]
    input: [click, drag, fill, fill_form, handle_dialog, hover, press_key, type_text, upload_file]
    emulation: [emulate, resize_page]
    debugging: [evaluate_script, get_console_message, get_css_styles, lighthouse_audit, list_console_messages, screencast_start, screencast_stop, take_screenshot, take_snapshot]
    network: [get_network_request, list_network_requests]
    performance: [performance_analyze_insight, performance_start_trace, performance_stop_trace]

# Skills copied into kit/.claude/skills/ by `npm run skills:vendor`, pinned by full commit. agent-skills is pinned at
