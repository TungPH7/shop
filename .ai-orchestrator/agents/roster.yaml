# Every agent also has Read, Glob and Grep. No agent has Skill, Agent, WebFetch or WebSearch (spec 2.3).
# tools: Bash, Edit, Write. jira: read, create, edit, comment, link, transition. git: read or write (read only: spec 2.10).
# writes: the files Edit and Write may touch; the protected paths of quality/gates.yaml still apply. max_turns: twice
# the most model turns of a live run of the role, rounded up to tens (spec 2.2; runs of tasks/archive/agent-roster/
# verification.md). The most of fe-dev, 130, is its run at max, so a run raised for a hard item still fits.
roles:
  pm:
    description: "Project Manager: writes the morning summary of the space from Jira and GitHub, with the weekly retro figures on Fridays. Read only."
    model: sonnet
    effort: medium
    max_turns: 20
    tools: [Bash, Write]
    jira: [read]
    git: read
    writes: [".ai/**"]
    skills: []
  ba:
    description: "Business Analyst: writes the SPEC of an Epic with numbered acceptance criteria, then creates its Stories and Tasks from the plan. Give it the Epic key."
    model: opus
    effort: xhigh
    max_turns: 90
    tools: [Bash, Edit, Write]
    jira: [read, create, edit, comment, link]
    git: write
    writes: ["docs/specs/**", "CHANGELOG.md", ".ai/**"]
    skills: [spec-driven-development, interview-me]
  ux:
    description: "UI/UX designer: writes design.md for an Epic that touches the UI, as numbered ASCII screens or from approved Figma images. Give it the Epic key."
    model: sonnet
    effort: xhigh
    max_turns: 60
    tools: [Bash, Edit, Write]
    # comment: ux answers a "Cần ux:" request with a comment, which closes it (human-loop spec 3.3, Lượt 122).
    jira: [read, comment]
    git: write
    writes: ["docs/specs/**", ".ai/**"]
    skills: [frontend-ui-engineering]
  sa:
    description: "Solution Architect: adds the non-functional requirements to a SPEC, then writes the plan of the Epic with its API contract and task list. Give it the Epic key."
    model: opus
    effort: xhigh
    max_turns: 80
    tools: [Bash, Edit, Write]
    jira: [read, comment]
    git: write
    writes: ["docs/specs/**", "docs/adr/**", ".ai/**"]
    skills: [planning-and-task-breakdown, api-and-interface-design, documentation-and-adrs]
  fe-dev:
    description: "Frontend Developer: builds a ready item, or its FE Sub-task, with TDD on its branch and opens the PR. Give it the Jira key."
    model: opus
    effort: high
    max_turns: 260
    tools: [Bash, Edit, Write]
    mcp: { chrome-devtools: [navigation, input, emulation, debugging, network, performance] }
    jira: [read, edit, comment, transition]
    git: write
    writes: ["**"]
    skills: [test-driven-development, incremental-implementation, frontend-ui-engineering, browser-testing-with-devtools]
  be-dev:
    description: "Backend Developer: builds a ready item, or its BE Sub-task, with TDD on its branch and opens the PR. Give it the Jira key."
    model: opus
    effort: high
    max_turns: 170
    tools: [Bash, Edit, Write]
    jira: [read, edit, comment, transition]
    git: write
    writes: ["**"]
    skills: [test-driven-development, incremental-implementation, api-and-interface-design]
  reviewer:
    description: "Code Reviewer: reviews a PR on five axes and posts the report. Give it the PR number."
    model: opus
    effort: xhigh
    max_turns: 70
    tools: [Bash, Write]
    jira: [read]
    git: read
    writes: [".ai/**"]
    skills: [code-review-and-quality]
  security:
    description: "Security Engineer: reviews a PR for security, starting from a short threat model, and posts the report. Give it the PR number."
    model: opus
    effort: max
    max_turns: 120
    tools: [Bash, Write]
    jira: [read]
    git: read
    writes: [".ai/**"]
    skills: [security-and-hardening, sentry-security-review]
  qa:
    description: "Tester/QA Engineer: checks a deployed item against each acceptance criterion, with evidence, and posts the QA report. Give it the Jira key."
    model: opus
    effort: high
    max_turns: 80
    tools: [Bash, Write]
    jira: [read, create, edit, comment, transition]
    git: read
    writes: [".ai/**"]
    skills: [playwright-cli]
  devops:
    description: "DevOps Engineer: changes CI/CD workflows through a PR, cuts releases and ships. Give it the Jira key."
    model: opus
    effort: high
    max_turns: 50
    tools: [Bash, Edit, Write]
    jira: [read, edit, comment, transition]
    git: write
    writes: ["**"]
    skills: [ci-cd-and-automation, shipping-and-launch]
