  - { name: code-review-and-quality, repo: addyosmani/agent-skills, path: skills/code-review-and-quality, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
  - { name: security-and-hardening, repo: addyosmani/agent-skills, path: skills/security-and-hardening, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
  - { name: ci-cd-and-automation, repo: addyosmani/agent-skills, path: skills/ci-cd-and-automation, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
