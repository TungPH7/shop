  - { name: frontend-ui-engineering, repo: addyosmani/agent-skills, path: skills/frontend-ui-engineering, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
  - { name: planning-and-task-breakdown, repo: addyosmani/agent-skills, path: skills/planning-and-task-breakdown, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
  - { name: api-and-interface-design, repo: addyosmani/agent-skills, path: skills/api-and-interface-design, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
  - { name: documentation-and-adrs, repo: addyosmani/agent-skills, path: skills/documentation-and-adrs, commit: aeac41d4d005999432bb7312f7ff06383a91d59d }
