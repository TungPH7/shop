# How the deployer on the VPS builds, runs and smoke-tests the apps of shop (docs/release-workflow.md). ao-kit add
# writes each app here; the smoke checks are yours to add to.
apps:
  user:
    dockerfile: apps/user/Dockerfile
    port: 3000
    # next-intl sends / to /en (localePrefix 'always'), and the smoke test does not follow a redirect.
    health: /en
    public: true
    # From /etc/ao/secrets/shop/<environment>.env: the server checks both when it starts.
    env: [API_URL, AUTH_SECRET]
  admin:
    dockerfile: apps/admin/Dockerfile
    port: 5173
    health: /
    public: true
smoke:
  - app: user
    path: /en
    expect_status: 200
    expect_text: <html
  - app: admin
    path: /
    expect_status: 200
    expect_text: <html
