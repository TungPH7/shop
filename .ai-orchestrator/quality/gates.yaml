# Quality gates of a project (quality-gates spec sections 2.2–2.8). CI, merge-gate, audit, gh:protect and the hooks read
# the project's copy in .ai-orchestrator/quality/. That copy is a protected path, and a PR that lowers a threshold here
# turns the policy job red.

# The jobs of kit/.github/workflows/ci.yml; merge-gate, audit and the rulesets of PRs require every one of them.
checks: [policy, build-test, secrets, sast]

# Coverage of the lines a PR adds or changes, read from the lcov files the project's test:coverage script writes. The
# project's coverage must include every source file, even one no test imports yet. Config files and generated
# migrations are left out (Checkpoint 1, 2026-10-29), and so is the kit copy in .ai-orchestrator/ and .claude/, whose
# code is tested in the kit. So are the scripts at the root of a project, which run on your machine, as scripts/dev.mjs
# starts the apps (project-scaffold T17).
# A Java app writes the JaCoCo XML report of its test:coverage (mvn verify), and its sources sit in src/main/java/
# (project-scaffold part 3, spec 2.3). The e2e/ and scripts/ of each app of a pnpm project are left out as those at the
# root are. An app leaves more out with coverage_exclude in project.yaml, a protected file.
coverage:
  changed_lines_min: 80
  lcov: ["coverage/lcov.info", "apps/*/coverage/lcov.info"]
  jacoco: ["apps/*/target/site/jacoco/jacoco.xml"]
  source: ["**/*.{ts,tsx,js,jsx,mjs,cjs}", "**/src/main/java/**/*.java"]
  exclude: ["**/*.{test,spec}.*", "**/*.e2e-spec.*", "**/*.d.ts", "**/*.config.*", "**/migrations/**", "{,apps/*/}e2e/**", "{,apps/*/}scripts/**", ".ai-orchestrator/**", ".claude/**"]

# npm audit fails on this level and above. An exception names a GitHub advisory, why it is accepted, and when it ends.
dependencies:
  audit_level: high
  exceptions: []

# Lines that switch a check off. A line that also carries the reason marker passes, so the reviewer can read why;
# a `never` pattern fails even with a reason.
suppressions:
  reason_marker: "reason:"
  patterns:
    - "eslint-disable"
    - "oxlint-disable"   # oxlint, the linter of NestJS 12, honours both (Pilot 1 T1)
    - "@ts-ignore"
    - "@ts-nocheck"
    - ".skip("
    - "xit("
    - "xdescribe("
    - "istanbul ignore"
    - "c8 ignore"
    - "nosemgrep"
    - "gitleaks:allow"
    - "secretlint-disable"
    # Java (project-scaffold part 3, spec 2.3): javac, SonarQube, JUnit, Checkstyle, Spotless, SpotBugs, PMD, and
    # @Generated, which JaCoCo leaves out of the coverage.
    - "@SuppressWarnings"
    - "NOSONAR"
    - "@Disabled"
    - "CHECKSTYLE:OFF"
    - "CHECKSTYLE.OFF"
    - "spotless:off"
    - "@SuppressFBWarnings"
    - "NOPMD"
    - "@Generated"
  never: [".only("]

# Branches only a PR may change, and the merge method of each kind of work item branch.
protected_branches: [develop, main, "release/*"]
merge_method:
  feature: squash
  bugfix: squash
  hotfix: squash

# The PR of a release branch into main, and the PR that merges main back into develop or the open release branch
# (release-workflow spec 2.7). merge-gate merges both with a merge commit, so each release keeps its history on main. A
# release PR needs green CI and your approval on its head; after it merges, merge-gate tags the merge commit and opens
# the merge back. A merge back needs green CI, no conflict, and the head of main to be the commit of a v* tag, which only
# ao-merge and you may make (Pilot 3, spec 2.9): every commit of main passed gate ③ or gate ⑤. The PR of the release
# report, release-notes/vX.Y.Z into release/vX.Y.Z, needs green CI and to change only that report and CHANGELOG.md.
release_pull_requests:
  merge_method: merge
  tag: v<VERSION>
  back_merge_bases: [develop, "release/*"]
  back_merge_after_release: develop

# Files an agent may not edit, except the roles listed as editors. A PR of an agent that touches one is never merged by
# merge-gate: you read the diff and merge it yourself. A path is compared in any case (.Claude/ is .claude/), since a
# Windows checkout writes both into one folder.
protected_paths:
  - { path: ".github/workflows/**", editors: [devops] }
  - { path: ".githooks/**" }
  - { path: ".claude/**" }
  - { path: ".ai-orchestrator/**" }
  - { path: ".mcp.json" }
  - { path: ".github/CODEOWNERS" }

# The effort of a full security review (Pilot 1, review cost): the roster's when the PR touches a protected path or one
# of these paths, or when its item or one of its Sub-tasks has an effort label; lower_effort otherwise. A review of only
# the changes since the last report stays at high (dev-workflow spec 2.6).
security_review:
  roster_effort_paths:
    # dependencies and how the app is built and run
    - "**/package.json"
    - "**/package-lock.json"
    - "**/Dockerfile*"
    - "**/docker-compose*.{yml,yaml}"
    - "**/compose*.{yml,yaml}"
    - "**/.npmrc"
    - "**/pnpm-lock.yaml"
    # pnpm 10 and later: which packages run install scripts (allowBuilds), skip the release cooldown, or are overridden
    - "**/pnpm-workspace.yaml"
    - "**/yarn.lock"
    - "**/.env*"
    - "**/next.config.*"
    - "**/main.ts"
    # where requests come in or are checked: NestJS and Next.js
    - "**/*.module.ts"
    - "**/*.controller.*"
    - "**/*.guard.*"
    - "**/*.pipe.*"
    - "**/*.filter.*"
    - "**/*.interceptor.*"
    - "**/*.middleware.*"
    - "**/*.strategy.*"
    - "**/*.dto.*"
    - "**/middleware.*"
    - "**/proxy.*"
    - "**/route.*"
    - "**/actions.*"
    # who the user is, and secrets
    - "**/auth/**"
    - "**/*auth*.*"
    - "**/*session*.*"
    - "**/*crypto*.*"
    # where data is read and written. Services are left out: most backend PRs change one, and would all be at max.
    - "**/*.repository.*"
    - "**/*.entity.*"
    - "**/prisma/**"
    - "**/migrations/**"
    - "**/*.sql"
    # Spring Boot (project-scaffold part 3, spec 2.3): how it is built, its config, where requests come in or are
    # checked, who the user is, and what it reads and writes. Services stay out, as for NestJS.
    - "**/pom.xml"
    - "**/.mvn/**"
    - "**/mvnw*"
    - "**/application*.{yml,yaml,properties}"
    - "**/*Controller.java"
    - "**/*Filter.java"
    - "**/*Interceptor.java"
    - "**/*Security*.java"
    - "**/*Auth*.java"
    - "**/security/**"
    - "**/*Repository.java"
    - "**/domain/**"
    - "**/dto/**"
  lower_effort: high

# A PR that copies a kit another project reviewed in full (kit-copy-review spec 2.2, 2.3): ao-step compares it with the
# reviewed head and writes both reports, with no agent. A project's own files, such as .ai-orchestrator/project.yaml
# and .ai-orchestrator/deploy.yaml (project-scaffold spec 2.1), are in none of these lists, so a PR that changes one is
# reviewed as usual; .claude/settings.json, rendered from project.yaml, is checked as rendered below.
kit_copy:
  # The same in every project, compared both ways.
  same:
    - ".ai-orchestrator/{agents,contract,docs,lib,quality,scripts,templates,tracker}/**"
    - ".ai-orchestrator/package*.json"
    - ".claude/hooks/**"
    - ".githooks/**"
    - ".mcp.json"
    - ".jira/config.yml"
    - ".github/workflows/{ci,jira-sync,merge-gate}.yml"
  # A project adds the skills of its stack, so only the files the PR changes are compared.
  same_when_changed: [".claude/skills/**"]
  # They hold the space key and the stack skills of the project: ao-step renders them again.
  # settings.json takes the env of the project from its project.yaml (project-scaffold spec 2.1).
  rendered: [".claude/agents/**", ".claude/rules/ai-orchestrator.md", ".claude/settings.json"]
  # A copy may point only at the newest PR of the other project on this path and branch, so it cannot go back to an older
  # kit.
  newest_path: .ai-orchestrator/lib
  newest_branch: develop

# The docs PR of an Epic (dev-workflow spec 2.4): every file it changes is under these paths, its head is this branch,
# ao-dev opened it, and <EPIC> is an Epic. merge-gate merges it without reviews or approval once the Epic is past this
# gate and the CI run of its head started before you approved; audit takes its merge commit on the same terms. Rule Q5
# keeps the paths in docs/, away from the protected paths, and the gate a gate of the contract.
docs_pull_requests:
  paths: ["docs/specs/<EPIC>/**", "docs/adr/**"]
  branch: "feature/<EPIC>-spec"
  gate: plan-approval

# The GitHub Apps of the agents: the variables that name each App, the roles that use it, and the ao-pr.mjs commands
# those roles may run with it.
github_apps:
  dev:
    env: AO_DEV_APP
    roles: [ba, sa, fe-dev, be-dev, devops]
    commands: [create, edit, comment]
  review:
    env: AO_REVIEW_APP
    roles: [reviewer, security]
    commands: [review]
