# The config of this project (SPEC-project-scaffold.md 2.1), written by ao-kit init from the profile base-pnpm.
name: shop
package_manager: pnpm
jira:
  space: SHOP
github:
  repo: TungPH7/shop
  approvers:
    - TungPH7
  apps:
    dev: tungph7-ao-dev
    dev_id: 5514949
    review: tungph7-ao-review
    review_id: 5514961
    merge: tungph7-ao-merge
    merge_id: 5756976
  kit_peers: []
repos:
  - name: shop
    path: .
apps:
  user:
    repo: shop
    path: apps/user
    profile: nextjs
    dev: pnpm --filter ./apps/user run dev
    port:
      env: PORT
      default: 3000
    health: /en
    public: true
    # C1 spec 6.1: seo writes the SEO of the screens of this app at stage spec (SHOP-78).
    seo: true
    # The localhost URLs the apps give each other, here so that a lane moves them by its offset (review of shop PR #21);
    # the .env files keep the rest.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # The Spring Boot api, as for admin; without it the E2E of user called the old NestJS api (review of PR #40, SHOP-55).
      API_URL: http://localhost:3001
    # Test helpers, not code of the app: the changed-lines check skips them (SHOP-38; PR #19 and #20 went red on them).
    coverage_exclude:
      - src/testing/**
    hosts:
      development: shop-dev.ao.t2g.io.vn
      staging: shop-staging.ao.t2g.io.vn
      production: shop.ao.t2g.io.vn
  admin:
    repo: shop
    path: apps/admin
    profile: react
    dev: pnpm --filter ./apps/admin run dev
    port:
      env: PORT
      default: 5173
    health: /
    public: true
    # C1 spec 6.1: the admin pages are not for search engines, so seo writes no SEO for them (SHOP-78).
    seo: false
    env:
      API_URL: http://localhost:3001
    # Test helpers, not code of the app: the changed-lines check skips them (SHOP-38; PR #20 went red on setup.ts).
    coverage_exclude:
      - src/testing/**
    hosts:
      development: shop-admin-dev.ao.t2g.io.vn
      staging: shop-admin-staging.ao.t2g.io.vn
      production: shop-admin.ao.t2g.io.vn
  api:
    repo: shop
    path: apps/api
    profile: spring-boot
    dev: pnpm --filter ./apps/api run dev
    env:
      APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    port:
      env: PORT
      default: 3001
    health: /actuator/health
    # The <excludes> of jacoco-maven-plugin in apps/api/pom.xml, as source paths; MapperImpl is generated in target/.
    coverage_exclude:
      - src/main/java/com/tungph7/learnpostgres/LearnPostgresqlApiApplication.java
      - src/main/java/com/tungph7/learnpostgres/feature/**/dto/**
      - src/main/java/com/tungph7/learnpostgres/common/dto/**
      - src/main/java/com/tungph7/learnpostgres/common/config/**
      - src/main/java/**/*Properties.java
      - src/main/java/com/tungph7/learnpostgres/common/error/ErrorCode.java
      - src/main/java/com/tungph7/learnpostgres/common/error/ProblemDetailOpenApiCustomizer.java
      - src/main/java/com/tungph7/learnpostgres/common/error/BadRequestException.java
      - src/main/java/com/tungph7/learnpostgres/common/domain/CitextType.java
roles:
  optional: []
claude:
  allow: []
# Lanes (parallel-runs spec, approved at Phiên 32 · Lượt 35): the build and fix of each item run in a worktree of their
# own next to this folder, shop-wt/<KEY>; three lanes at once, one agent each, while 1.5 GB of RAM stay free (3 GB until
# SHOP-55, Phiên 33 · Lượt 2: with Chrome and VS Code open the agents ran one at a time). The lanes get the untracked env
# files the apps read on this machine.
runs:
  worktrees: true
  lanes_max: 3
  min_free_ram_gb: 1.5
  copy:
    - apps/api/.env
    - apps/user/.env.development
  # Each slot's own Postgres in Docker Compose: project, container, volume, network and port (review of shop PR #21:
  # every lane shared one). Your database in this folder keeps the defaults.
  lane_env:
    ports:
      DB_PORT: 5432
      POSTGRES_HOST_PORT: 5432
    names:
      COMPOSE_PROJECT_NAME: learn-postgresql-api
      POSTGRES_CONTAINER_NAME: learn-postgres
      COMPOSE_NETWORK_NAME: learn-app-network
# Paths of shop added to a review tier (Low 9 of the second review of PR #79, SHOP-79): the JSON-LD component is the
# one place of user that renders with dangerouslySetInnerHTML, so security reviews it.
review:
  sensitive_paths:
    - apps/user/src/components/seo/**
